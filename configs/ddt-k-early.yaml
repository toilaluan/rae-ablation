schema_version: 13

data:
  repository: benjamin-paine/imagenet-1k-256x256
  revision: 1bd0400450249a7fe90c0aece37d0d03e7ea956a
  split: train
  workers: 16
  prefetch_factor: 4
  max_samples: null

rae:
  base_repository: toilaluan/raev2-dinov3l-k7
  base_revision: 46ce5a7e76df99eb5528020d3c65cef528a355fa
  compressor_repository: toilaluan/raev2-compressor
  compressor_revision: 846e2213dcf6218d3b726448ae52d8104c925c0f
  trust_remote_code: true
  remote_code_schema: 1
  micro_batch_size: 16
  cache:
    directory: data/rae-tokens
    batch_size: 128
    log_interval: 10

model:
  input_size: 8
  patch_size: [1, 1]
  in_channels: 1024
  hidden_size: [768, 2048]
  depth: [12, 2]
  num_heads: [12, 16]
  mlp_ratio: 4.0
  base_model_depth: 4
  num_classes: 1000
  cfg_dropout_prob: 0.1
  num_timestep_tokens: 4
  num_class_tokens: 8
  gradient_checkpointing: false
  variant: DDT-B/1-RAEv2-8x8

exploration:
  k_early: 4
  k_full: 1
  early_candidate_chunk_size: null
  full_candidate_chunk_size: null

compile:
  enabled: true
  backend: inductor
  mode: default
  fullgraph: true
  dynamic: false

train:
  epochs: 80
  global_batch_size: 1024
  max_steps: null
  grad_clip: 1.0
  ema_decay: 0.9995
  seed: 0
  timestep_loc: 0.0
  timestep_scale: 1.0
  timestep_shift: 4.0
  velocity_denominator_floor: 0.05
  base_loss_weight: 1.0
  optimizer:
    kind: muon
    lr: 2.0e-4
    min_lr: 2.0e-5
    weight_decay: 0.0
    beta1: 0.9
    beta2: 0.95

prior:
  checkpoint_dir: null
  weight_source: ema

sampling:
  num_samples: 50000
  batch_size: 32
  sampling_steps: 50
  solver: euler
  timestep_shift: 4.0
  ig_scale: 1.78
  ig_start: 0.1
  ig_end: 1.0
  cfg_scale: 1.0
  cfg_start: 0.0
  cfg_end: 1.0
  log_interval: 10

evaluation:
  reference_npz: data/VIRTUAL_imagenet256_labeled.npz
  batch_size: 32
  device: auto
  log_interval: 10

validation:
  interval: 5
  periodic_samples: 10000
  final_samples: 50000
  plan_path: validation-plan.pt
  validate_now: false

checkpoint:
  directory: checkpoints
  interval: 5
  keep_last_n: 8
  save_best_fid: true

wandb:
  enabled: false
  entity: null
  project: rae-ddt-k-exploration
  name: ddt-k4-early
  group: null
  tags: []
  mode: online
  checkpoint_artifacts: false
