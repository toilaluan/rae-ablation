codec: rae
cache:
  codec: both
  directory: cache/imagenet-train
  split: train
  shard_size: 8192
  batch_size: 1024
  workers: 16
  prefetch_factor: 4
  output_buffers: 3
  verify: true
model:
  in_channels: 1024
  use_patch_forcing: false
  encoder_hidden_size: 768
  decoder_hidden_size: 2048
  encoder_depth: 12
  decoder_depth: 2
  encoder_num_heads: 12
  decoder_num_heads: 16
  mlp_ratio: 4.0
  base_model_depth: 4
  num_time_tokens: 4
  num_class_tokens: 8
  num_classes: 1000
  dropout: 0.0
  gradient_checkpointing: false
compile:
  enabled: true
  backend: inductor
  mode: default
  fullgraph: false
  dynamic: false
train:
  epochs: 80
  global_batch_size: 1024
  micro_batch_size: 256
  grad_clip: 1.0
  ema_decay: 0.9995
  seed: 0
  timestep_loc: 0.0
  timestep_scale: 1.0
  optimizer:
    kind: muon
    lr: 0.0002
    min_lr: 0.00002
    weight_decay: 0.0
    beta1: 0.9
    beta2: 0.95
validation:
  interval: 5
  periodic_samples: 5000
  final_samples: 50000
  plan_path: validation-plan.pt
checkpoint:
  directory: checkpoints
  interval: 5
  keep_last_n: 8
  save_best_fid: true
wandb:
  enabled: false
  project: rae-ablation
  mode: online
  checkpoint_artifacts: false
