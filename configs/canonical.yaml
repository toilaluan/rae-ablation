codec: rae
cache:
  codec: both
  directory: cache/imagenet-train
  split: train
  shard_size: 2048
  batch_size: 1024
  workers: 16
  prefetch_factor: 4
  output_buffers: 3
  verify: true
model:
  in_channels: 1024
  hidden_size: 1024
  depth: 16
  num_heads: 16
  mlp_size: 4096
  patch_size: 1
  base_grid_size: 8
  early_exit_block: 4
  num_classes: 1000
  dropout: 0.0
  gradient_checkpointing: false
  depth_attention:
    enabled: true
    stride: 4
compile:
  enabled: true
  backend: inductor
  mode: default
  fullgraph: false
  dynamic: false
train:
  epochs: 80
  global_batch_size: 1024
  micro_batch_size: 256
  grad_clip: 1.0
  ema_decay: 0.9995
  seed: 0
  optimizer:
    kind: muon
    lr: 0.0008
    min_lr: 0.00008
    weight_decay: 0.05
    beta1: 0.9
    beta2: 0.95
validation:
  interval: 10
  periodic_samples: 5000
  final_samples: 50000
  plan_path: validation-plan.pt
checkpoint:
  directory: checkpoints
  interval: 10
  keep_last_n: 8
  save_best_fid: true
wandb:
  enabled: false
  project: rae-ablation
  mode: online
  checkpoint_artifacts: false
