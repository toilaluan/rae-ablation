schema_version: 6

experiment:
  name: adjacent-flow-ddt
  seed: 0
  output_directory: runs/experiment

data:
  repository: benjamin-paine/imagenet-1k-256x256
  revision: 1bd0400450249a7fe90c0aece37d0d03e7ea956a
  split: train
  validation_split: validation
  image_size: 128
  workers: 8
  prefetch_factor: 2
  max_samples: null
  shuffle: true

encoder:
  repository: facebook/dinov3-vitb16-pretrain-lvd1689m
  revision: 5931719e67bbdb9737e363e781fb0c67687896bc
  patch_size: 16
  hidden_size: 768
  num_register_tokens: 4
  apply_final_norm: true

pixel_training:
  name: rgb
  epochs: 120
  timestep_shift: 7.0
  use_representation_guiding: true
  lora:
    use_lora: false
    rank: 8
    alpha: 8.0
    dropout: 0.0
    target_groups: [attention, feedforward, conditioning, projections]
  representations:
    directory: data/direct-representations
    manifest: manifest.json
    stages:
      - name: dino12
        epochs: 50
        source: {kind: dino, layer: 12}
        timestep_shift: 4.0
      - name: dino8
        epochs: 5
        source: {kind: dino, layer: 8}
        timestep_shift: 4.0
    dtype: bfloat16
    cache_batch_size: 256
    asynchronous_writes: true
    statistics_dtype: float64
    normalization_epsilon: 1.0e-6
    require_complete: true

model:
  architecture: ddt
  token_dim: 768
  encoder:
    width: 768
    depth: 12
    heads: 12
  decoder:
    width: 2048
    depth: 2
    heads: 16
  feedforward:
    mlp_ratio: 4.0
  attention:
    qk_norm: true
    rope: true
    sdpa: true
  conditioning:
    num_classes: 1000
    class_dropout_probability: 0.1
    timestep_tokens: 4
    class_tokens: 8
  gradient_checkpointing: false

curriculum:
  mixing:
    adjacent:
      probability: 0.1
      distribution: uniform
      minimum: 0.0
      maximum: 1.0
    pure_next_probability: 0.0
    all_levels:
      probability: 0.0
      distribution: uniform_simplex
      concentration: 1.0
    final_stage: pure
  source_consistency_weight: 0.0

objective:
  prediction: x0
  loss_space: velocity
  timestep_distribution: shifted_logit_normal
  timestep_loc: 0.0
  timestep_scale: 1.0
  denominator_floor: 0.05
  cosine_loss_weight: 0.0
  cosine_loss_epsilon: 1.0e-8

optimizer:
  kind: adamw
  adamw:
    lr: 2.0e-4
    betas: [0.9, 0.95]
    weight_decay: 0.0
  scheduler:
    kind: constant
    warmup_epochs: 0
    min_lr_ratio: 0.0
  gradient_clip: 1.0
  global_batch_size: 1024
  ema_decay: 0.999

sampling:
  steps: 50
  solver: euler
  timestep_shift: 1.0
  guidance_scale: 3.0
  guidance_start: 0.0
  guidance_end: 1.0
  batch_size: 32
  seed: 0

validation:
  interval_epochs: 5
  batches: 32
  pca_preview_samples: 16
  periodic_samples: 10000

checkpoint:
  directory: checkpoints
  interval_epochs: 5
  save_stage_boundaries: true
  keep_last_n: 8
  resume: null

compile:
  enabled: true
  backend: inductor
  mode: default
  fullgraph: false
  dynamic: false

wandb:
  enabled: true
  entity: null
  project: adjacent-flow-ddt
  name: null
  group: null
  tags: []
  mode: online
  checkpoint_artifacts: false

evaluation:
  num_samples: 50000
  reference_npz: data/VIRTUAL_imagenet128_labeled.npz
  metrics: [fid, is]
  batch_size: 32
  device: auto
  report_flops: true
  report_peak_memory: true
