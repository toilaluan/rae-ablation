schema_version: 8

experiment:
  name: joint-semantic-pixel-ddt
  seed: 0
  output_directory: runs/experiment

data:
  repository: benjamin-paine/imagenet-1k-256x256
  revision: 1bd0400450249a7fe90c0aece37d0d03e7ea956a
  split: train
  image_size: 128
  workers: 8
  prefetch_factor: 2
  max_samples: null
  shuffle: true

encoder:
  repository: facebook/dinov3-vitb16-pretrain-lvd1689m
  revision: 5931719e67bbdb9737e363e781fb0c67687896bc
  patch_size: 16
  hidden_size: 768
  num_register_tokens: 4
  apply_final_norm: true

training:
  epochs: 200
  timestep_shift: 4.0
  decoder:
    update_interval: 1
    updates_per_active_step: 1
    backpropagate_to_flow: true

representations:
  directory: data/direct-representations
  manifest: manifest.json
  semantic:
    name: dino12
    layer: 12
  cache_batch_size: 256
  normalization_epsilon: 1.0e-6
  require_complete: true

model:
  architecture: ddt
  token_dim: 768
  base_prediction_depth: 8
  encoder:
    width: 768
    depth: 12
    heads: 12
  semantic_decoder:
    width: 2048
    depth: 2
    heads: 16
  pixel_decoder:
    width: 2048
    depth: 3
    heads: 16
    encoder_features: [4, 8, 12]
    decoder_features: [1, 2]
    fusion:
      kind: concatenate
      layer_attention:
        width: 768
        depth: 1
        heads: 12
        mlp_ratio: 2.0
  feedforward:
    mlp_ratio: 4.0
  attention:
    qk_norm: true
    rope: true
    sdpa: true
  conditioning:
    num_classes: 1000
    class_dropout_probability: 0.1
    timestep_tokens: 4
    class_tokens: 8
  gradient_checkpointing: false

objective:
  timestep_loc: 0.0
  timestep_scale: 1.0
  denominator_floor: 0.05
  base_velocity_weight: 1.0
  pixel_l1_weight: 1.0
  pixel_lpips_weight: 1.0

optimizer:
  kind: adamw
  adamw:
    lr: 2.0e-4
    betas: [0.9, 0.95]
    weight_decay: 0.0
  scheduler:
    kind: constant
    warmup_epochs: 0
    min_lr_ratio: 0.0
  gradient_clip: 1.0
  global_batch_size: 1024
  ema_decay: 0.999

sampling:
  steps: 50
  solver: euler
  timestep_shift: 1.0
  internal_guidance:
    scale: 1.78
    t_min: 0.10
    t_max: 1.0
  batch_size: 32
  seed: 0

validation:
  interval_epochs: 5
  batches: 32
  periodic_samples: 10000

checkpoint:
  directory: checkpoints
  interval_epochs: 5
  resume: null

compile:
  enabled: true
  backend: inductor
  mode: default
  fullgraph: false
  dynamic: false

wandb:
  enabled: true
  entity: null
  project: joint-semantic-pixel-ddt
  name: null
  group: null
  tags: []
  mode: online

evaluation:
  num_samples: 50000
  reference_npz: data/VIRTUAL_imagenet128_labeled.npz
  batch_size: 32
  device: auto
