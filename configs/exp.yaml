data:
  repository: benjamin-paine/imagenet-1k-256x256
  revision: 1bd0400450249a7fe90c0aece37d0d03e7ea956a
  split: train
  workers: 8
  prefetch_factor: 2
  max_samples: null
model:
  image_size: 256
  patch_size: 32
  in_channels: 3
  hidden_size: 768
  depth: 12
  num_heads: 12
  mlp_ratio: 4.0
  num_classes: 1000
  class_dropout_prob: 0.1
  gradient_checkpointing: false
  variant: SiT-B
  reg:
    enabled: true
    repa_enabled: false
    model_name: vit_base_patch16_dinov3.lvd1689m
    feature_dim: 768
    register_tokens: 4
    token_mode: cls_spatial
    pool_size: 4
    # repa_block: 4
    # repa_hidden_size: 2048
    cls_predictor: wide_intermediate
    cls_head_block: 4
    cls_head_hidden_size: 2048
    cls_head_depth: 2
    cls_head_mlp_ratio: 3.0
    x0_conditioning: true
    continuation_tokens: 4
    patch_reprojection:
      enabled: false
      source: x0_cls
      intermediate_size: 4096
      include_timestep: true
    cls_loss_weight: 0.03
    repa_loss_weight: 0.0
reg_cache:
  enabled: true
  directory: data/reg-tokens
compile:
  enabled: true
  backend: inductor
  mode: default
  fullgraph: true
  dynamic: false
train:
  epochs: 80
  global_batch_size: 1024
  micro_batch_size: 512
  max_steps: null
  grad_clip: 1.0
  ema_decay: 0.9995
  seed: 0
  timestep_loc: -0.8
  timestep_scale: 0.8
  horizontal_flip_probability: 0.0
  optimizer:
    kind: muon
    lr: 0.0002
    min_lr: 0.00002
    weight_decay: 0.0
    beta1: 0.9
    beta2: 0.95
validation:
  interval: 5
  periodic_samples: 10000
  final_samples: 50000
  plan_path: validation-plan.pt
  validate_now: true
checkpoint:
  directory: checkpoints
  interval: 5
  keep_last_n: 8
  save_best_fid: true
wandb:
  enabled: false
  entity: null
  project: jit-reg
  name: null
  group: null
  tags: []
  mode: online
  checkpoint_artifacts: false
