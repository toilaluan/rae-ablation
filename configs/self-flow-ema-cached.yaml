schema_version: 11

data:
  repository: benjamin-paine/imagenet-1k-256x256
  revision: 1bd0400450249a7fe90c0aece37d0d03e7ea956a
  split: train
  workers: 16
  prefetch_factor: 4
  max_samples: null

vae:
  model_name: black-forest-labs/FLUX.2-klein-4B
  revision: 5e67da950fce4a097bc150c22958a05716994cea
  subfolder: vae
  micro_batch_size: 16
  cache:
    enabled: true
    directory: data/latents
    batch_size: 128
    log_interval: 10

model:
  image_size: 256
  in_channels: 128
  patch_size: 2
  hidden_size: 768
  depth: 12
  num_heads: 12
  mlp_ratio: 4.0
  num_classes: 1000
  class_dropout_prob: 0.1
  gradient_checkpointing: false
  variant: SiT-B/2

objective:
  kind: ema
  mixed_token_probability: 0.25
  align_layers: [4, 8]
  alignment_weight: 0.8
  projector_hidden_size: 1536
  ema_decay: 0.9999
  sigreg:
    clean_forward: truncated
    weight: 0.1
    projections: 1024
    knots: 17
    max_frequency: 3.0
    projection_chunk_size: 128

compile:
  enabled: true
  backend: inductor
  mode: default
  fullgraph: false
  dynamic: false

train:
  epochs: 80
  global_batch_size: 1024
  max_steps: null
  grad_clip: 1.0
  seed: 0
  timestep_loc: 0.0
  timestep_scale: 1.0
  optimizer:
    kind: adamw
    lr: 0.0002
    min_lr: 0.00002
    weight_decay: 0.0
    beta1: 0.9
    beta2: 0.95

sampling:
  num_samples: 50000
  batch_size: 128
  sampling_steps: 50
  solver: euler
  guidance_scale: 3.0
  timestep_shift: 1.0
  cfg_start: 0.0
  cfg_end: 1.0
  log_interval: 10

evaluation:
  reference_npz: data/VIRTUAL_imagenet256_labeled.npz
  batch_size: 128
  device: auto
  log_interval: 10

validation:
  interval: 5
  periodic_samples: 10000
  final_samples: 50000
  plan_path: validation-plan.pt
  validate_now: false

checkpoint:
  directory: checkpoints
  interval: 5
  keep_last_n: 8
  save_best_fid: true

wandb:
  enabled: false
  entity: null
  project: self-flow
  name: self-flow-ema-cached
  group: null
  tags: []
  mode: online
  checkpoint_artifacts: false
