schema_version: 8
data:
  repository: benjamin-paine/imagenet-1k-256x256
  revision: 1bd0400450249a7fe90c0aece37d0d03e7ea956a
  split: train
  workers: 16
  prefetch_factor: 4
  max_samples: null
feature_cache:
  enabled: false
  directory: data/features
  batch_size: 128
  log_interval: 10
vae:
  model_name: black-forest-labs/FLUX.2-klein-4B
  revision: 5e67da950fce4a097bc150c22958a05716994cea
  subfolder: vae
  micro_batch_size: 16
  cache:
    enabled: false
    directory: data/latents
    batch_size: 128
    log_interval: 10
model:
  input_space: flux2_latents
  image_size: 256
  in_channels: 128
  patch_size: 1
  num_img_t_tokens: 1
  num_reg_t_tokens: 0
  num_c_tokens: 1
  hidden_size: 768
  depth: 12
  num_heads: 12
  mlp_ratio: 4.0
  fused_mlp: false
  num_classes: 1000
  class_dropout_prob: 0.1
  gradient_checkpointing: false
  variant: DDT-B
  decoder:
    hidden_size: 2048
    depth: 2
    num_heads: 16
    mlp_ratio: 4.0
  features:
    encoder:
      model_name: vit_base_patch16_dinov3.lvd1689m
      feature_dim: 768
      register_tokens: 4
    reg:
      enabled: false
      pool_size: 4
      target_std: 0.53
      loss_weight: 0.03
      internal_guidance_block: 4
      independent_attention: false
      reg_dropout_prob: 0.0
      lora:
        enabled: false
        rank: 16
        alpha: 16.0
        mlp: false
    repa:
      enabled: false
      block: 4
      projection_hidden_size: 2048
      loss_weight: 0.5
      token_scope: image
compile:
  enabled: true
  backend: inductor
  mode: default
  fullgraph: true
  dynamic: false
train:
  epochs: 80
  global_batch_size: 1024
  max_steps: null
  grad_clip: 1.0
  ema_decay: 0.9995
  seed: 0
  timestep_loc: -0.8
  timestep_scale: 0.8
  reg_timestep_loc: -0.8
  reg_timestep_scale: 0.8
  optimizer:
    kind: muon
    lr: 0.0002
    min_lr: 0.00002
    weight_decay: 0.0
    beta1: 0.9
    beta2: 0.95
sampling:
  num_samples: 50000
  batch_size: 32
  sampling_steps: 50
  solver: euler
  guidance_scale: 1.78
  reg_guidance_scale: 1.78
  timestep_shift: 1.0
  reg_timestep_shifts: [1.0]
  img_denoising_interval: [0.0, 1.0]
  reg_denoising_interval: [0.0, 1.0]
  cfg_start: 0.0
  cfg_end: 0.9
  log_interval: 10
evaluation:
  reference_npz: data/VIRTUAL_imagenet256_labeled.npz
  batch_size: 32
  device: auto
  log_interval: 10
validation:
  interval: 5
  periodic_samples: 10000
  final_samples: 50000
  plan_path: validation-plan.pt
  validate_now: true
checkpoint:
  directory: checkpoints
  interval: 5
  keep_last_n: 8
  save_best_fid: true
wandb:
  enabled: false
  entity: null
  project: jit-reg
  name: null
  group: null
  tags: []
  mode: online
  checkpoint_artifacts: false
