schema_version: 18

data:
  repository: benjamin-paine/imagenet-1k-256x256
  revision: 1bd0400450249a7fe90c0aece37d0d03e7ea956a
  split: train
  validation_split: validation
  validation_size: 50000
  workers: 8
  prefetch_factor: 4
  max_samples: null

vision:
  repository: facebook/dinov3-vitb16-pretrain-lvd1689m
  revision: 5931719e67bbdb9737e363e781fb0c67687896bc
  target_layer: 2
  semantic_layer: 12
  image_size: 128
  patch_size: 16
  hidden_size: 768
  num_register_tokens: 4
  statistics_path: data/dino-endpoint-statistics.safetensors
  compile:
    enabled: true
    backend: inductor
    mode: default
    fullgraph: true
    dynamic: false
  cache:
    enabled: false
    directory: data/dino-endpoints
    batch_size: 128
    log_interval: 10

decoder:
  checkpoint: null
  width: 768
  depth: 8
  num_heads: 12
  mlp_ratio: 4.0
  output_patch_size: 16
  discriminator_channels: 64
  loss:
    l1_weight: 1.0
    lpips_weight: 1.0
    gan_weight: 0.1
    gan_enabled: true
    gan_start_fraction: 0.2
  train:
    epochs: 10
    global_batch_size: 1024
    max_steps: null
    lr: 0.0002
    min_lr: 0.00002
    grad_clip: 1.0
    ema_decay: 0.9995
    seed: 0
    validation_interval: 1
    validation_batches: 128
    sample_interval: 1000

model:
  input_size: 8
  patch_size: 1
  in_channels: 768
  hidden_size: 768
  depth: 12
  num_heads: 12
  mlp_ratio: 4.0
  gradient_checkpointing: true
  variant: LightningDiT-B/1-DINOv3B-8x8-Semantic-AdaLN

flow:
  endpoint: target
  train:
    epochs: 20
    global_batch_size: 1024
    max_steps: null
    grad_clip: 1.0
    ema_decay: 0.9995
    seed: 0
    timestep_loc: 0.0
    timestep_scale: 1.0
    timestep_shift: 4.0
    optimizer:
      kind: adamw
      lr: 0.0002
      min_lr: 0.0002
      weight_decay: 0.0
      beta1: 0.9
      beta2: 0.95

compile:
  enabled: true
  backend: inductor
  mode: default
  fullgraph: true
  dynamic: false

sampling:
  batch_size: 32
  steps: 40
  solver: euler
  timestep_shift: 4.0
  noise_seed: 0
  log_interval: 10

evaluation:
  reference_npz: data/VIRTUAL_imagenet128_labeled.npz
  batch_size: 32
  device: auto
  log_interval: 10
  reconstruction_fid: true

validation:
  interval: 2
  periodic_samples: 10000
  final_samples: 50000
  plan_path: validation-plan.pt
  validate_now: false

checkpoint:
  directory: checkpoints
  interval: 2
  keep_last_n: 8
  save_best_lpips: true

wandb:
  enabled: true
  entity: null
  project: dino-semantic-bridge
  name: semantic-to-target
  group: null
  tags: [dinov3, reconstruction, flow-matching]
  mode: online
  checkpoint_artifacts: false
