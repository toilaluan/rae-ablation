schema_version: 2

data:
  repository: benjamin-paine/imagenet-1k-256x256
  revision: 1bd0400450249a7fe90c0aece37d0d03e7ea956a
  split: train
  validation_split: validation
  workers: 16
  prefetch_factor: 4
  max_samples: null

model:
  architecture: latent
  image_latent_patch_size: 2
  semantic_patch_size: 1
  hidden_size: [1152, 2048]
  depth: [28, 2]
  num_heads: [16, 16]
  mlp_ratio: 4.0
  base_model_depth: 8
  num_classes: 1000
  class_dropout_probability: 0.1
  num_timestep_tokens: 4
  num_class_tokens: 8
  gradient_checkpointing: false

image_latents:
  repository: mage-flow-community/Mage-Flow
  revision: 5edf242ad658cb85050ee077c6629d59e5388fe7
  weight_file: vae/diffusion_pytorch_model.safetensors
  image_size: 256
  channels: 128
  latent_size: 16
  posterior: mean
  compile:
    enabled: true
    backend: inductor
    mode: default
    fullgraph: true
    dynamic: false
  cache:
    enabled: true
    directory: data/image-latents
    batch_size: 128
    log_interval: 10
    asynchronous_writes: true

semantic_tokens:
  repository: facebook/dinov3-vitb16-pretrain-lvd1689m
  revision: 5931719e67bbdb9737e363e781fb0c67687896bc
  image_size: 128
  patch_size: 16
  channels: 768
  grid_size: 8
  num_register_tokens: 4
  statistics_path: data/semantic-statistics.safetensors
  compile:
    enabled: true
    backend: inductor
    mode: default
    fullgraph: true
    dynamic: false
  cache:
    enabled: false
    directory: data/semantic-tokens
    batch_size: 128
    log_interval: 10
    asynchronous_writes: true

compile:
  enabled: true
  backend: inductor
  mode: default
  fullgraph: true
  dynamic: false

train:
  epochs: 80
  global_batch_size: 1024
  max_steps: null
  grad_clip: 1.0
  ema_decay: 0.9995
  seed: 0
  timestep_loc: 0.0
  timestep_scale: 1.0
  timestep_shift: 4.0
  velocity_denominator_floor: 0.05
  semantic_base_loss_weight: 1.0
  predicted_semantic_condition_probability: 0.25
  optimizer:
    kind: adamw
    lr: 0.0002
    min_lr: 0.0002
    weight_decay: 0.0
    beta1: 0.9
    beta2: 0.95

sampling:
  num_samples: 50000
  batch_size: 32
  semantic_steps: 0
  image_steps: 40
  solver: euler
  timestep_shift: 1.0
  semantic_guidance_scale: 1.78
  semantic_guidance_start: 0.1
  semantic_guidance_end: 1.0
  class_guidance_scale: 1.0
  class_guidance_start: 0.0
  class_guidance_end: 1.0
  log_interval: 10

evaluation:
  reference_npz: data/VIRTUAL_imagenet256_labeled.npz
  batch_size: 32
  device: auto
  log_interval: 10

validation:
  interval: 5
  periodic_samples: 10000
  final_samples: 50000
  plan_path: validation-plan.pt
  validate_now: false

checkpoint:
  directory: checkpoints
  interval: 5
  keep_last_n: 8
  save_best_fid: true

wandb:
  enabled: false
  entity: null
  project: cascade-dit
  name: null
  group: null
  tags: [latent]
  mode: online
  checkpoint_artifacts: false
